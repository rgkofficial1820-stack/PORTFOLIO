    <script>
      // Automatically redirect to trailing slash on GitHub Pages so relative asset URLs never 404
      (function() {
        if (window.location.hostname.endsWith('github.io')) {
          var p = window.location.pathname;
          if (!p.endsWith('/') && !p.split('/').pop().includes('.')) {
            window.location.replace(window.location.protocol + '//' + window.location.host + p + '/' + window.location.search + window.location.hash);
          }
        }
      })();
    </script>
